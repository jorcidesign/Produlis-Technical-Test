version: '3.9'

services:
  mysql:
    image: mysql:8.0
    container_name: oms_mysql
    restart: unless-stopped
    network_mode: host
    command: --port=${MYSQL_PORT:-3307}
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-oms_db}
      MYSQL_USER: ${MYSQL_USER:-oms_user}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-oms_password}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root_password}
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-P", "3307", "-u", "root", "-p${MYSQL_ROOT_PASSWORD:-root_password}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  # Se activan una vez existan los Dockerfile de cada app (fase de codificación, no de scaffolding)
  # backend:
  #   build: ./backend
  #   ports:
  #     - '3001:3001'
